<html lang="en">
<head>
<meta charset="utf-8">
<title data-message="mapTitle"></title>
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="map.css">
<script type="module" src="../map.js"></script>
</head>
<body>
<!-- Inert while the help is open over it. -->
<div id="content" class="content">
<header class="header">
  <img src="/icons/logo.svg" alt="" width="24" height="24">
  <div class="title"><b data-message="mapTitle"></b><span id="subtitle"></span></div>
  <div class="actions">
    <!-- Hidden until the event page says something is kept, the only case it purges anything. -->
    <button type="button" id="ask-purge" class="danger" data-message="mapPurgeAll" hidden></button>
    <p id="purge-question" class="question" hidden></p>
    <button type="button" id="purge" class="danger" data-message="mapPurge" hidden></button>
    <button type="button" id="purge-cancel" data-message="mapCancel" hidden></button>
  </div>
  <!-- The script names it, for its tooltip and for those who cannot see it. -->
  <button type="button" id="help" class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.1 6.3A1.9 1.9 0 1 1 9.221 7.755C8.6 8.15 8 8.6 8 9.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.7" r="1" fill="currentColor"/></svg></button>
</header>
<div class="legend">
  <span class="item"><svg width="28" height="10" aria-hidden="true"><line class="link red4" x1="0" y1="5" x2="28" y2="5"/></svg><span data-message="mapLegendRed4"></span></span>
  <span class="item"><svg width="28" height="10" aria-hidden="true"><line class="link red3" x1="0" y1="5" x2="28" y2="5"/></svg><span data-message="mapLegendRed3"></span></span>
  <span class="item"><svg width="28" height="10" aria-hidden="true"><line class="link orange4" x1="0" y1="5" x2="28" y2="5"/></svg><span data-message="mapLegendOrange4"></span></span>
  <span class="item"><svg width="28" height="10" aria-hidden="true"><line class="link orange3" x1="0" y1="5" x2="28" y2="5"/></svg><span data-message="mapLegendOrange3"></span></span>
  <span class="item"><svg width="28" height="10" aria-hidden="true"><line class="link blue2" x1="0" y1="5.5" x2="28" y2="5.5"/></svg><span data-message="mapLegendBlue2"></span></span>
  <span class="item"><img src="/icons/red.svg" alt="" width="16" height="16"><img src="/icons/orange.svg" alt="" width="16" height="16"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle class="point" cx="8" cy="8" r="3.5"/></svg><span data-message="mapLegendSite"></span></span>
  <!-- The pirate flag, an example that names no country of the providers. -->
  <span class="item"><span>🏴‍☠️</span><span data-message="mapLegendProvider"></span></span>
  <span id="legend-supposed" class="item" hidden><span>❓</span><span data-message="mapLegendSupposed"></span></span>
  <span id="scope" class="item"></span>
</div>
<div id="tools" class="tools" hidden>
  <div class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.75" cy="6.75" r="4.75" fill="none"/><path d="M10.25 10.25L14.5 14.5"/></svg><input type="search" id="search" autocomplete="off" spellcheck="false"></div>
  <div id="chips" class="chips"></div>
  <div id="shown-count" class="shown" hidden><span id="shown"></span><button type="button" id="clear-filters" class="text-link" data-message="mapClearFilters"></button></div>
</div>
<div class="body">
  <div id="plan" class="plan">
    <p id="empty" class="empty" hidden></p>
    <div id="no-match" class="empty" hidden><p data-message="mapNoMatch"></p><button type="button" id="no-match-clear" data-message="mapClearFilters"></button></div>
    <div id="drawing" class="drawing"></div>
  </div>
  <aside id="panel" class="panel">
    <button type="button" id="back" class="back" data-message="mapBack" hidden></button>
    <div id="panel-content"></div>
    <!-- What a click on an address did, for a screen reader: the chip it shows is not read. -->
    <p id="announce" class="sr" aria-live="polite"></p>
  </aside>
</div>
</div>
<div id="help-veil" class="veil" hidden>
  <div class="help-window" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="help-head">
      <!-- Titled by the name of the question mark that opens it. -->
      <p id="help-title" class="help-title" data-message="helpOpen"></p>
      <button type="button" id="help-close" class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    </div>
    <!-- Written by the script, a paragraph or a list for each part, then
         the about section. -->
    <div id="help-text" class="help-text"></div>
  </div>
</div>
</body>
</html>
